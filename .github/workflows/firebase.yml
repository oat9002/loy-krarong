name: Deploy to Firebase

on:
  push:
    branches: [claude/fervent-wright-gwk9of, main]
    paths: ["public/**", "firestore.rules", "firebase.json", ".github/workflows/firebase.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write service account key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::error::Missing secret FIREBASE_SERVICE_ACCOUNT (see README)"; exit 1
          fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy hosting + Firestore rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@13 deploy --only hosting,firestore:rules --project loy-kratong-2ea09 --non-interactive
      - name: Clean up key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
